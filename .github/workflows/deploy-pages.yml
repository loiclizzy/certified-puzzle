name: Deploy Certified Puzzle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify web files
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/styles.css
          test -s web/ocaml_verifier.js
          ls -lh web/ocaml_verifier.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
